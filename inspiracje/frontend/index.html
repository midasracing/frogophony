<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kurs włoskiego</title>
  <link rel="stylesheet" href="./course.css">
  <style>
    body { margin: 0; font: 1rem/1.5 system-ui, sans-serif; background: var(--paper); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main id="course" class="course-home">
    <div>
      <h1>Włoski na wyjazd</h1>
      <section class="course-unit">
        <h2>W piekarni</h2>
        <ol>
          <li aria-current="step"><button id="start" class="course-button">Zacznij lekcję</button></li>
          <li>Zapytaj o skład</li>
        </ol>
      </section>
    </div>
    <aside aria-label="Twój wynik"><p id="summary">Dwie krótkie lekcje</p></aside>
  </main>
  <form id="lesson" class="lesson" hidden>
    <header>
      <button id="close" type="button">Wróć do kursu</button>
      <progress aria-label="Postęp lekcji"></progress>
    </header>
    <section class="lesson-task" aria-label="Ćwiczenie"></section>
    <footer class="lesson-footer">
      <div class="lesson-actions">
        <p class="lesson-feedback" role="status"></p>
        <button type="submit" class="course-button">Sprawdź</button>
      </div>
    </footer>
  </form>
  <script type="module">
    import { setupLesson } from './lesson.mjs'

    const course = document.querySelector('#course')
    const lesson = document.querySelector('#lesson')
    const start = document.querySelector('#start')
    const close = document.querySelector('#close')
    const summary = document.querySelector('#summary')
    const questions = [
      { prompt: 'Które słowo oznacza chleb?', choices: ['il pane', 'il latte', 'il riso'], correct: 0 },
      { prompt: 'Jak poprosisz o kawałek?', choices: ['Un litro', 'Un pezzo', 'Un bicchiere'], correct: 1 },
    ]
    let disposeLesson

    function showCourse() {
      disposeLesson?.()
      lesson.hidden = true
      course.hidden = false
      start.focus()
    }

    start.addEventListener('click', () => {
      course.hidden = true
      lesson.hidden = false
      disposeLesson = setupLesson(lesson, questions, ({ correct, total }) => {
        summary.textContent = `Wynik lekcji: ${correct} / ${total}`
        start.textContent = 'Powtórz lekcję'
        showCourse()
      })
      close.focus()
    })
    close.addEventListener('click', showCourse)
  </script>
</body>
</html>
