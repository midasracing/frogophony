name: Research provenance
on:
  push:
    branches: [main]
    paths: ['database/**', 'docs/research/**', 'docs/archive/**', 'scripts/**', 'src/**', 'public/**', 'package.json', '.github/workflows/research.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-research.mjs
      - run: node scripts/check-structure.mjs
